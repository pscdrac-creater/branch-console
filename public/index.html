<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Branch Console</title>
<link rel="icon" href="/icon.svg" />
<style>
  :root {
    --bg: #0b0f14; --panel: #131920; --panel2: #1a212b; --border: #2a323d; --border2: #3d4856;
    --text: #e8edf3; --text2: #b6c0cc; --muted: #8894a3; --faint: #5f6b7a;
    --accent: #4c9aff; --accent-d: #2f7de0;
    --green: #3fb950; --red: #f85149; --amber: #e3b341; --purple: #b392f0;
    --radius: 10px; --mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
    /* one row = these six columns; the column header uses the same template so they line up */
    --cols: minmax(280px, 1fr) 110px 120px 180px 160px 320px;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font: 14px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }
  a { color: var(--accent); text-decoration: none; }
  a:hover { text-decoration: underline; }
  button, input { font: inherit; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  .wrap { max-width: 1560px; margin: 0 auto; padding: 0 20px 120px; }
  .spacer { flex: 1; }
  .muted { color: var(--muted); } .faint { color: var(--faint); }
  .mono { font-family: var(--mono); }

  /* ── sticky top: title bar, toolbar, column header ── */
  .top { position: sticky; top: 0; z-index: 20; background: var(--bg); padding-top: 16px; }
  .bar1 { display: flex; align-items: center; gap: 10px 12px; flex-wrap: wrap; }
  .bar1 h1 { font-size: 18px; margin: 0; letter-spacing: .2px; display: flex; align-items: center; gap: 9px; }
  .bar1 h1 img { width: 22px; height: 22px; border-radius: 6px; }
  .repo { color: var(--text2); font: 600 13px/1 var(--mono); }
  .chip { display: inline-flex; align-items: center; gap: 6px; padding: 3px 10px; border-radius: 999px;
    font-size: 12px; border: 1px solid var(--border); background: var(--panel); color: var(--text2); }
  .chip b { font: 600 12px/1 var(--mono); color: var(--text); }
  .chip.dirty { color: var(--amber); border-color: #4d3f18; }
  .chip.clean { color: var(--green); border-color: #1f3d28; }
  .fresh { color: var(--muted); font-size: 12.5px; }
  .fresh .old { color: var(--amber); }

  .bar2 { display: flex; align-items: center; gap: 10px 14px; flex-wrap: wrap; margin-top: 14px; }
  .views { display: inline-flex; gap: 6px; flex-wrap: wrap; }
  .view { background: var(--panel); color: var(--text2); border: 1px solid var(--border); border-radius: 999px;
    padding: 5px 12px; font-size: 13px; cursor: pointer; display: inline-flex; align-items: center; gap: 7px; }
  .view:hover { border-color: var(--border2); color: var(--text); }
  .view .n { font: 600 11.5px/1 var(--mono); color: var(--muted); }
  .view.on { background: var(--accent); border-color: var(--accent); color: #fff; }
  .view.on .n { color: #dbe9ff; }
  .view.attn:not(.on) .n { color: var(--amber); }
  .minef { display: inline-flex; align-items: center; gap: 6px; color: var(--text2); font-size: 13px; cursor: pointer; user-select: none; }
  .minef input { accent-color: var(--accent); width: 15px; height: 15px; }
  .search { background: var(--panel); border: 1px solid var(--border); color: var(--text); border-radius: 8px;
    padding: 6px 11px; width: 240px; font-size: 13px; }
  .search::placeholder { color: var(--faint); }
  .lbl { color: var(--muted); font-size: 12.5px; }
  .seg { display: inline-flex; border: 1px solid var(--border); border-radius: 8px; overflow: hidden; }
  .seg button { background: var(--panel); color: var(--muted); border: 0; padding: 6px 12px; font: 12.5px/1.2 var(--mono); cursor: pointer; }
  .seg button.on { background: var(--accent); color: #fff; }
  .seg button:not(.on):hover { background: var(--panel2); color: var(--text); }

  .colhead { display: grid; grid-template-columns: var(--cols); gap: 0 16px; padding: 14px 16px 8px 20px; margin-top: 4px;
    border-bottom: 1px solid var(--border); color: var(--muted); font-size: 11px; text-transform: uppercase; letter-spacing: .7px; }
  .colhead span:last-child { text-align: right; }

  /* ── banners ── */
  .banner { margin: 14px 0 0; padding: 10px 14px; border-radius: var(--radius); font-size: 13.5px;
    display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
  .banner.warn { background: rgba(227,179,65,.1); border: 1px solid #4d3f18; color: #f0d58a; }
  .banner.bad { background: rgba(248,81,73,.1); border: 1px solid #79302c; color: #ffb4ad; }
  .banner code { background: #06090d; padding: 1px 6px; border-radius: 4px; font-family: var(--mono); color: var(--text); }
  .banner .btn { margin-left: auto; }
  .banner .btn + .btn { margin-left: 0; }

  /* ── buttons ── */
  button.btn { background: var(--panel2); color: var(--text); border: 1px solid var(--border2);
    border-radius: 8px; padding: 6px 13px; font-size: 13px; cursor: pointer; white-space: nowrap; }
  button.btn:hover:not(:disabled) { border-color: var(--muted); }
  button.btn:disabled { opacity: .45; cursor: not-allowed; }
  button.btn.accent { background: var(--accent); border-color: var(--accent); color: #fff; }
  button.btn.accent:hover:not(:disabled) { background: var(--accent-d); }
  button.btn.red { background: var(--red); border-color: var(--red); color: #fff; }
  button.btn.ghost { background: transparent; }
  button.btn.attn { border-color: var(--amber); color: var(--amber); }

  /* ── groups + rows ── */
  .group { margin-top: 22px; }
  .group h2 { margin: 0 0 9px; font-size: 12.5px; font-weight: 600; text-transform: uppercase; letter-spacing: .8px; color: var(--text2);
    display: flex; align-items: baseline; gap: 9px; }
  .group h2 .n { font: 600 12px/1 var(--mono); color: var(--muted); }
  .group h2 small { font-size: 12.5px; font-weight: 400; text-transform: none; letter-spacing: 0; color: var(--faint); }
  .rows { display: flex; flex-direction: column; gap: 8px; }

  .row { background: var(--panel); border: 1px solid var(--border); border-radius: var(--radius);
    box-shadow: inset 4px 0 0 var(--tone, var(--border2)); }
  .row.tone-good { --tone: var(--green); } .row.tone-info { --tone: var(--accent); } .row.tone-warn { --tone: var(--amber); }
  .row.tone-bad { --tone: var(--red); } .row.tone-done { --tone: #6e5aa8; } .row.tone-idle { --tone: var(--border2); }
  .row.open { border-color: var(--border2); }
  .row-main { display: grid; grid-template-columns: var(--cols); gap: 6px 16px; align-items: center; padding: 12px 16px 12px 20px; cursor: pointer; }
  .row-main:hover { background: rgba(255,255,255,.018); border-radius: var(--radius); }

  .cell { min-width: 0; font-size: 13px; display: flex; flex-direction: column; gap: 2px; align-items: flex-start; }
  .cell::before { display: none; content: attr(data-label); color: var(--faint); font-size: 10.5px; text-transform: uppercase; letter-spacing: .6px; }
  .cell .up { color: var(--green); } .cell .down { color: #e0957a; } .cell .ok { color: var(--green); } .cell .warn { color: var(--amber); }
  .cell .sub { font-size: 12px; }

  .c-branch { gap: 4px; }
  .l1 { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; max-width: 100%; }
  .exp { background: transparent; border: 0; color: var(--muted); cursor: pointer; padding: 0; width: 14px; font-size: 11px; line-height: 1; transition: transform .12s; }
  .row.open .exp { transform: rotate(90deg); color: var(--text); }
  .bname { font: 600 14.5px/1.3 var(--mono); color: var(--text); word-break: break-all; }
  .bname.main { color: var(--purple); }
  .tag { font-size: 11px; padding: 1px 8px; border-radius: 999px; border: 1px solid var(--border); color: var(--muted); white-space: nowrap; }
  .tag.cur { color: var(--green); border-color: #1f3d28; background: rgba(63,185,80,.08); }
  .tag.notmine { color: var(--amber); border-color: #4d3f18; }
  .tag.yours { color: #7db7ff; border-color: #1f3a5f; background: rgba(76,154,255,.08); }
  .l2 { display: flex; align-items: baseline; gap: 9px; flex-wrap: wrap; padding-left: 22px; max-width: 100%; }
  .verdict { font-weight: 600; font-size: 13px; display: inline-flex; align-items: center; gap: 7px; white-space: nowrap; color: var(--tone-c, var(--text2)); }
  .verdict i { width: 8px; height: 8px; border-radius: 50%; background: currentColor; flex: none; }
  .tone-good .verdict { --tone-c: var(--green); } .tone-info .verdict { --tone-c: #7db7ff; } .tone-warn .verdict { --tone-c: var(--amber); }
  .tone-bad .verdict { --tone-c: #ff7b72; } .tone-done .verdict { --tone-c: var(--purple); } .tone-idle .verdict { --tone-c: var(--muted); }
  .hint { color: var(--text2); font-size: 12.5px; }
  .l3 { color: var(--muted); font-size: 12.5px; padding-left: 22px; max-width: 100%; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

  .pill { display: inline-flex; align-items: center; gap: 4px; padding: 0 8px; border-radius: 999px; font-size: 11.5px; line-height: 1.6;
    border: 1px solid var(--border); color: var(--muted); white-space: nowrap; }
  .pill.open, .pill.pass { color: var(--green); border-color: #1f3d28; }
  .pill.draft, .pill.pending { color: var(--amber); border-color: #4d3f18; }
  .pill.merged { color: var(--purple); border-color: #3a2d52; }
  .pill.closed, .pill.fail { color: #ff7b72; border-color: #79302c; }
  .prline { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
  .prline a { font: 600 13px/1 var(--mono); }

  .wtname { font: 12.5px/1.3 var(--mono); color: var(--text2); word-break: break-all; }
  .ports { display: flex; gap: 5px; flex-wrap: wrap; }
  a.port { font: 11.5px/1.5 var(--mono); padding: 0 7px; border-radius: 5px; border: 1px solid var(--border); background: var(--panel2); }
  a.port.fe { color: #7db7ff; border-color: #1f3a5f; } a.port.be { color: var(--green); border-color: #1f3d28; }
  a.port:hover { text-decoration: none; border-color: currentColor; }

  .c-act { flex-direction: row; gap: 6px; justify-content: flex-end; align-items: center; }
  .act { background: transparent; color: var(--text2); border: 1px solid var(--border); border-radius: 7px;
    padding: 5px 0; font-size: 12.5px; line-height: 1.3; cursor: pointer; white-space: nowrap; text-align: center; flex: none; }
  .act:nth-child(1) { width: 56px; } .act:nth-child(2) { width: 68px; } .act:nth-child(3) { width: 62px; }
  .act:nth-child(4) { width: 54px; } .act:nth-child(5) { width: 56px; }
  a.act:hover { text-decoration: none; }
  .act:hover:not(:disabled) { border-color: var(--muted); color: var(--text); }
  .act:disabled { opacity: .32; cursor: not-allowed; }
  .act.danger:hover:not(:disabled) { border-color: var(--red); color: #ff7b72; }
  .act.sug { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 600; }
  .act.sug:hover:not(:disabled) { background: var(--accent-d); border-color: var(--accent-d); color: #fff; }
  .act.sug.danger { background: transparent; border-color: var(--red); color: #ff7b72; }
  .act.sug.danger:hover:not(:disabled) { background: rgba(248,81,73,.12); color: #ff7b72; border-color: var(--red); }
  body.busy .act, body.busy .banner .btn, body.busy .wbtn, body.busy .gbtn { pointer-events: none; opacity: .5; }

  /* expanded details */
  .details { border-top: 1px solid var(--border); padding: 14px 20px 16px 42px; display: grid; grid-template-columns: minmax(0, 1.5fr) minmax(0, 1fr) minmax(0, 1fr); gap: 18px 28px; }
  .det h4 { margin: 0 0 8px; font-size: 11px; text-transform: uppercase; letter-spacing: .7px; color: var(--muted); font-weight: 600; }
  .det h4 span { text-transform: none; letter-spacing: 0; font-weight: 400; color: var(--faint); margin-left: 6px; }
  .commits { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 5px; font-size: 12.5px; }
  .commits li { display: grid; grid-template-columns: 76px 1fr; gap: 0 8px; }
  .commits .sha { font-family: var(--mono); color: var(--faint); }
  .commits .who { color: var(--faint); }
  .plus { color: var(--green); } .minus { color: #ff7b72; }
  .kv { display: grid; grid-template-columns: 92px 1fr; gap: 4px 10px; font-size: 12.5px; margin: 0; }
  .kv dt { color: var(--muted); }
  .kv dd { margin: 0; color: var(--text); word-break: break-word; }
  .note { color: var(--text2); font-size: 12.5px; }

  .empty { color: var(--muted); text-align: center; padding: 48px 20px; }
  .empty .btn { margin-top: 12px; }
  .spin { display: inline-block; width: 13px; height: 13px; border: 2px solid var(--border2);
    border-top-color: var(--accent); border-radius: 50%; animation: s .7s linear infinite; vertical-align: -2px; }
  @keyframes s { to { transform: rotate(360deg); } }

  /* ── worktrees section ── */
  .wts h2 .exp { font-size: 11px; }
  .wts.open h2 .exp { transform: rotate(90deg); color: var(--text); }
  /* same column template as the branch rows, so Running and Actions line up with the headings above */
  .wt { background: var(--panel); border: 1px solid var(--border); border-radius: var(--radius);
    display: grid; grid-template-columns: var(--cols); gap: 6px 16px; align-items: center; padding: 10px 16px 10px 20px; font-size: 13px; }
  .wt-id { display: flex; flex-direction: column; gap: 3px; min-width: 0; }
  .wt-state { grid-column: 2 / 5; }
  .wt-name { font: 600 14px/1.3 var(--mono); word-break: break-all; }
  .wt-where { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; min-width: 0; word-break: break-all; color: var(--text2); }
  .wt-where .mono { font-size: 12.5px; }
  .wt .warn { color: var(--amber); } .wt .muted { color: var(--muted); }
  .wt-act { display: flex; gap: 6px; justify-content: flex-end; }
  .wbtn { background: transparent; color: var(--text2); border: 1px solid var(--border); border-radius: 7px;
    padding: 5px 12px; font-size: 12.5px; line-height: 1.3; cursor: pointer; white-space: nowrap; }
  .wbtn:hover:not(:disabled) { border-color: var(--muted); color: var(--text); }
  .wbtn:disabled { opacity: .32; cursor: not-allowed; }
  .wbtn.danger:hover:not(:disabled) { border-color: var(--red); color: #ff7b72; }

  /* ── output panel ── */
  .out { position: fixed; left: 0; right: 0; bottom: 0; background: #06090d; border-top: 1px solid var(--border2);
    max-height: 42vh; display: none; flex-direction: column; z-index: 30; }
  .out.show { display: flex; }
  .out .head { display: flex; align-items: center; gap: 10px; padding: 8px 16px; border-bottom: 1px solid var(--border); }
  .out .head .ttl { font-size: 12px; color: var(--muted); text-transform: uppercase; letter-spacing: .6px; }
  .out pre { margin: 0; padding: 12px 16px; overflow: auto; font: 12.5px/1.5 var(--mono); color: #c9d1d9; white-space: pre-wrap; }
  .okc { color: var(--green); } .errc { color: #ff7b72; }

  /* ── modal ── */
  .modal-bg { position: fixed; inset: 0; background: rgba(1,4,9,.72); display: none; align-items: center; justify-content: center; z-index: 50; }
  .modal-bg.show { display: flex; }
  .modal { width: min(580px, 92vw); background: var(--panel); border: 1px solid var(--border2); border-radius: 12px; padding: 20px 22px; }
  .modal h3 { margin: 0 0 4px; font-size: 16px; }
  .modal .desc { color: var(--text2); font-size: 13px; margin-bottom: 14px; }
  .modal .desc code, .minef code { font-family: var(--mono); font-size: 12px; }
  .cmd { background: #06090d; border: 1px solid var(--border); border-radius: 8px; padding: 11px 13px;
    font: 12.5px/1.6 var(--mono); color: #c9d1d9; white-space: pre-wrap; word-break: break-all; }
  .mwarn { margin-top: 12px; padding: 9px 12px; border-radius: 8px; font-size: 12.5px;
    background: rgba(227,179,65,.1); border: 1px solid #4d3f18; color: var(--amber); }
  .modal .field { margin-top: 12px; }
  .modal .field label { display: block; font-size: 12px; color: var(--muted); margin-bottom: 5px; }
  .modal input[type=text], .modal textarea { width: 100%; background: #06090d; color: var(--text); border: 1px solid var(--border);
    border-radius: 8px; padding: 8px 11px; font: 13px var(--mono); resize: vertical; }
  .modal input[type=number], .modal select { width: 100%; background: #06090d; color: var(--text); border: 1px solid var(--border);
    border-radius: 8px; padding: 8px 11px; font: 13px var(--mono); }
  .modal .two { display: grid; grid-template-columns: 1.6fr 1fr; gap: 12px; }
  .modal .choice { display: flex; gap: 18px; font-size: 13px; color: var(--text2); }
  .modal .choice label { display: inline-flex; align-items: center; gap: 6px; margin: 0; font-size: 13px; color: var(--text2); cursor: pointer; }
  .modal .prefixed { display: flex; align-items: center; background: #06090d; border: 1px solid var(--border); border-radius: 8px; }
  .modal .prefixed span { padding-left: 11px; color: var(--muted); font: 13px var(--mono); white-space: nowrap; }
  .modal .prefixed input[type=text] { border: 0; background: transparent; padding-left: 2px; }
  .modal .hint { margin-top: 6px; font-size: 12px; color: var(--muted); min-height: 1.4em; }
  .modal .hint.bad { color: var(--amber); }
  .modal .foot { display: flex; justify-content: flex-end; gap: 9px; margin-top: 18px; }

  /* ── narrow windows: stack each row (branch / labelled facts / actions) ── */
  @media (max-width: 1239px) {
    .wt { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .wt-id, .wt-act { grid-column: 1 / -1; }
    .wt-state { grid-column: auto; }
    .wt-act { justify-content: flex-start; }
    .colhead { display: none; }
    .top { border-bottom: 1px solid var(--border); padding-bottom: 12px; }
    .row-main { grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px 16px; align-items: start; }
    .c-branch, .c-act { grid-column: 1 / -1; }
    .c-act { justify-content: flex-start; padding-left: 22px; }
    .cell:not(.c-branch):not(.c-act)::before { display: block; }
    .c-vs { padding-left: 22px; }
    .details { grid-template-columns: 1fr; }
  }
  @media (max-width: 640px) {
    .row-main { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .c-push { padding-left: 0; } .c-pr { padding-left: 22px; }
    .search { width: 100%; }
    .c-act { flex-wrap: wrap; }
  }
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <div class="bar1">
      <h1><img src="/icon.svg" alt="" /> Branch Console</h1>
      <span class="repo" id="repoName">…</span>
      <span class="chip" id="curChip" style="display:none"></span>
      <span class="chip" id="dirtyChip" style="display:none"></span>
      <span class="spacer"></span>
      <span class="fresh" id="fresh"></span>
      <button class="btn accent gbtn" id="newWtBtn" title="Open a branch in its own folder, so you can work on two things at once">New worktree</button>
      <button class="btn gbtn" id="newBranchBtn" title="Start a new branch inside one of your worktrees">New branch</button>
      <button class="btn ghost" id="fetchBtn" title="git fetch --prune origin — get the latest from GitHub">Fetch</button>
      <button class="btn ghost" id="refreshBtn" title="Re-read branches and pull requests (r)">Refresh</button>
    </div>
    <div class="bar2">
      <div class="views" id="views"></div>
      <label class="minef" title="Only your branches: open in, or worked on in, one of your worktrees, or with your commits"><input type="checkbox" id="mineOnly" /> Mine only</label>
      <input class="search" id="q" type="search" placeholder="Search branches…   ( / )" autocomplete="off" spellcheck="false" />
      <span class="spacer"></span>
      <span class="lbl" title="Ahead / behind, Reset and Rebase all use this branch">Compare with</span>
      <div class="seg" id="seg"></div>
    </div>
    <div id="banners"></div>
    <div class="colhead" id="colhead"></div>
  </div>

  <section class="group wts open" id="wts"></section>

  <div id="list"><div class="empty"><span class="spin"></span> &nbsp;Loading branches…</div></div>
</div>

<!-- confirm / pr modal -->
<div class="modal-bg" id="modalBg">
  <div class="modal" id="modal" role="dialog" aria-modal="true"></div>
</div>

<!-- output panel -->
<div class="out" id="out">
  <div class="head">
    <span class="ttl" id="outTitle">Output</span>
    <span class="spacer"></span>
    <button class="btn ghost" id="outClose">Close</button>
  </div>
  <pre id="outPre"></pre>
</div>

<script>
const $ = (s) => document.querySelector(s);
const CLIENT_VERSION = 7;
const AUTO_REFRESH_MS = 30000;

// remembered per browser, so the page comes back the way you left it
const store = {
  get(k, d) { try { const v = localStorage.getItem('bc.' + k); return v === null ? d : JSON.parse(v); } catch { return d; } },
  set(k, v) { try { localStorage.setItem('bc.' + k, JSON.stringify(v)); } catch { /* private mode */ } },
};

let TARGET = store.get('target', null);     // null until the first state load picks a default
let VIEW = store.get('view', 'all');
let MINE_ONLY = store.get('mine', false);
let QUERY = '';
let STATE = { current: '', dirty: false, main: 'main', mainBehind: 0, mainAhead: 0 };
let DATA = { branches: [] };
let OPEN = new Set(store.get('open', []));  // branch names whose details are expanded
const DETAIL = {};                          // name → { key, loading } | { key, data }
let LOADED_AT = 0, LOAD_ERR = '', LOADING = false, BUSY = false, LAST_SIG = '';

const api = {
  state:    () => fetch('/api/state').then((r) => r.json()),
  branches: (t, force) => fetch('/api/branches?target=' + encodeURIComponent(t) + (force ? '&force=1' : '')).then((r) => r.json()),
  detail:   (name, t) => fetch('/api/branch?name=' + encodeURIComponent(name) + '&target=' + encodeURIComponent(t)).then((r) => r.json()),
  post:     async (p, body) => {
    const res = await fetch('/api/' + p, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body || {}) });
    if (!res.ok) {
      if (res.status === 404)
        return { ok: false, error: `“/api/${p}” doesn’t exist on the running server — it’s on OLD code. Restart it: Ctrl-C in its terminal, then ./start.sh` };
      return { ok: false, error: `server returned HTTP ${res.status}` };
    }
    return res.json();
  },
};

function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c])); }
const num = (x) => Number(x || 0).toLocaleString('en-US');
const plural = (x, w) => `${num(x)} ${w}${x === 1 ? '' : 's'}`;

function ago(ms) {
  if (!ms) return 'never';
  const s = Math.max(0, Math.round((Date.now() - ms) / 1000));
  if (s < 10) return 'just now';
  if (s < 60) return `${s}s ago`;
  if (s < 3600) return `${Math.round(s / 60)} min ago`;
  if (s < 86400) return `${Math.round(s / 3600)}h ago`;
  return `${Math.round(s / 86400)}d ago`;
}
function fmtDate(iso) {
  if (!iso) return '—';
  try { return new Date(iso).toLocaleString(undefined, { month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit' }); }
  catch { return iso; }
}

// ── command previews (mirror server.js) ──
const resetCmd  = (b) => b === STATE.current ? `git reset --hard ${TARGET}` : `git branch -f ${b} ${TARGET}`;
const rebaseCmd = (b) => b === STATE.current ? `git rebase ${TARGET}` : `git rebase ${TARGET} ${b}`;
const prCmd     = (b) => `git push -u origin ${b}\ngh pr create --base ${STATE.main} --head ${b} --fill`;

// ── load ──
async function load({ force = false } = {}) {
  if (LOADING) return;
  LOADING = true;
  $('#refreshBtn').innerHTML = '<span class="spin"></span>';
  try {
    let st;
    if (TARGET === null) {                       // first visit: compare with the remote truth
      st = await api.state();
      TARGET = st.hasOriginMain ? 'origin/' + st.main : st.main;
    }
    const [st2, data] = await Promise.all([st || api.state(), api.branches(TARGET, force)]);
    st = st2;
    if (![st.main, 'origin/' + st.main].includes(TARGET) || (!st.hasOriginMain && TARGET !== st.main)) {
      TARGET = st.hasOriginMain ? 'origin/' + st.main : st.main; // stored target no longer valid → reload with a good one
      LOADING = false;
      return await load({ force });
    }
    STATE = st; LOADED_AT = Date.now(); LOAD_ERR = '';
    if (st.version !== CLIENT_VERSION) {         // old server: its data lacks what this page needs — say so, don't guess
      renderBanners();
      $('#list').innerHTML = '<div class="empty">Restart the server to see your branches.</div>';
      return;
    }
    const { prAt, ...rest } = data;              // prAt changes on every lookup; don't redraw just for it
    const sig = JSON.stringify([st.current, st.dirty, st.dirtyCount, st.mainBehind, st.mainAhead, st.version, rest]);
    DATA = data;
    renderHeader();
    renderBanners();
    if (sig !== LAST_SIG) { LAST_SIG = sig; renderList(); renderWorktrees(); }
  } catch (e) {
    LOAD_ERR = 'Can’t reach the Branch Console server. Is it still running? Start it again with ./start.sh';
    renderBanners();
  } finally {
    LOADING = false;
    $('#refreshBtn').textContent = 'Refresh';
    renderFresh();
  }
}

// ── header, toolbar, banners ──
function renderHeader() {
  document.title = `Branch Console — ${STATE.repoName || ''}`;
  $('#repoName').textContent = STATE.repoName || STATE.repo;
  $('#repoName').title = STATE.repo;
  const cur = $('#curChip');
  cur.style.display = 'inline-flex';
  cur.innerHTML = `on <b>${esc(STATE.current)}</b>`;
  cur.title = 'The branch checked out in ' + STATE.repo;
  const dc = $('#dirtyChip');
  dc.style.display = 'inline-flex';
  dc.className = 'chip ' + (STATE.dirty ? 'dirty' : 'clean');
  dc.textContent = STATE.dirty ? `${plural(STATE.dirtyCount || 1, 'uncommitted file')}` : 'clean tree';

  const targets = STATE.hasOriginMain ? ['origin/' + STATE.main, STATE.main] : [STATE.main];
  $('#seg').innerHTML = targets.map((t) =>
    `<button data-t="${esc(t)}" class="${t === TARGET ? 'on' : ''}" title="${t.startsWith('origin/') ? 'What is on GitHub (as of the last fetch)' : 'Your local copy of ' + esc(STATE.main)}">${esc(t)}</button>`).join('');
  $('#colhead').innerHTML = ['Branch', 'vs ' + esc(TARGET), 'Pushed', 'Pull request', 'Running', 'Actions'].map((h) => `<span>${h}</span>`).join('');
  $('#mineOnly').checked = MINE_ONLY;
}

function renderFresh() {
  if (!LOADED_AT) { $('#fresh').textContent = ''; return; }
  const f = STATE.fetchedAt;
  const old = !f || Date.now() - f > 30 * 60 * 1000;   // origin/* is only as fresh as the last fetch
  $('#fresh').innerHTML = `Updated ${ago(LOADED_AT)} · <span class="${old ? 'old' : ''}" title="${f ? esc(new Date(f).toLocaleString()) : ''} — origin/${esc(STATE.main)} is only as fresh as the last fetch">last fetch ${ago(f)}</span>`;
  $('#fetchBtn').classList.toggle('attn', old);
}

function renderBanners() {
  const out = [];
  if (LOAD_ERR) out.push(`<div class="banner bad">${esc(LOAD_ERR)}</div>`);
  if (LOADED_AT && STATE.version !== CLIENT_VERSION)
    out.push(`<div class="banner bad"><span><b>The server is running old code</b> (server v${esc(STATE.version || 1)}, page v${CLIENT_VERSION}). ` +
      `Some buttons will fail until you restart it: <code>Ctrl-C</code> in its terminal, then <code>./start.sh</code>.</span></div>`);
  if (DATA.prError)
    out.push(`<div class="banner warn"><span><b>Pull request info could not be loaded.</b> ` +
      (DATA.prAt ? `Showing what GitHub said ${ago(DATA.prAt)}.` : `The “Pull request” column and the status of each branch may be wrong.`) +
      ` <span class="muted">(${esc(DATA.prError)})</span></span><button class="btn" data-banner="retry">Retry</button></div>`);
  if (LOADED_AT && TARGET === STATE.main && STATE.mainBehind > 0)
    out.push(`<div class="banner warn"><span><b>You are comparing with local ${esc(STATE.main)}, which is ${plural(STATE.mainBehind, 'commit')} behind origin/${esc(STATE.main)}.</b> ` +
      `The “ahead” numbers below are inflated, and Reset / Rebase would use that old code.</span>` +
      `<button class="btn" data-banner="use-origin">Compare with origin/${esc(STATE.main)}</button>` +
      `<button class="btn" data-banner="update-main">Update local ${esc(STATE.main)}</button></div>`);
  $('#banners').innerHTML = out.join('');
}

// ── filtering ──
const VIEWS = [
  { key: 'all',     label: 'All',             test: () => true },
  { key: 'attn',    label: 'Needs attention', test: (b) => b.status.tone === 'warn' || b.status.tone === 'bad' },
  { key: 'pr',      label: 'Open PR',         test: (b) => b.pr && b.pr.state === 'OPEN' },
  { key: 'cleanup', label: 'Clean-up',        test: (b) => b.status.group === 'cleanup' },
];
const GROUPS = [
  { key: 'checkedout', title: 'Checked out',   sub: 'open in a worktree right now' },
  { key: 'active',     title: 'Other work',    sub: () => `has commits that are not in ${TARGET}` },
  { key: 'cleanup',    title: 'Safe to clean up', sub: () => `nothing here that is not already in ${TARGET}` },
  { key: 'base',       title: 'Base branch',   sub: '' },
];

function baseRows() {
  let rows = DATA.branches || [];
  if (MINE_ONLY) rows = rows.filter((b) => b.mine);
  const q = QUERY.trim().toLowerCase();
  if (q) rows = rows.filter((b) =>
    [b.name, b.subject, b.author, b.worktreeName, b.status.label, b.pr ? '#' + b.pr.number + ' ' + b.pr.title : '']
      .join(' ').toLowerCase().includes(q));
  return rows;
}
const findBranch = (name) => (DATA.branches || []).find((b) => b.name === name);

// ── cells ──
function vsCell(b) {
  if (b.name === TARGET) return '<span class="faint">this is the target</span>';
  if (!b.ahead && !b.behind) return '<span class="muted">= even</span>';
  return (b.ahead ? `<span class="up">↑ ${num(b.ahead)} ahead</span>` : '<span class="faint">0 ahead</span>') +
    (b.behind ? `<span class="down">↓ ${num(b.behind)} behind</span>` : '');
}

function pushCell(b) {
  const p = b.push, risk = b.ahead > 0 ? 'warn' : 'muted'; // only worrying if the branch has work of its own
  const up = b.upstream ? esc(b.upstream) : '';
  // nothing of its own → whatever is "not pushed" is in the target already, so nothing can be lost
  const safe = !b.ahead && b.name !== TARGET ? `<span class="sub faint">already in ${esc(TARGET)}</span>` : '';
  switch (p.kind) {
    case 'synced':   return `<span class="ok" title="same as ${up}">✓ in sync</span>`;
    case 'unpushed': return `<span class="${risk}" title="${plural(p.ahead, 'commit')} not on ${up}">↑ ${num(p.ahead)} not pushed</span>${safe}`;
    case 'behind':   return `<span class="muted" title="${up} has ${plural(p.behind, 'newer commit')}">↓ ${num(p.behind)} to pull</span>`;
    case 'diverged': return `<span class="warn" title="local and ${up} have different commits">↑ ${num(p.ahead)} ↓ ${num(p.behind)} diverged</span>`;
    case 'gone':     return `<span class="${risk}" title="${up} no longer exists on GitHub">remote deleted</span>${safe}`;
    default:         return `<span class="${risk}" title="this branch exists only on this machine">never pushed</span>${safe}`;
  }
}

function prStatePill(p) {
  if (p.state === 'MERGED') return '<span class="pill merged">merged</span>';
  if (p.state === 'CLOSED') return '<span class="pill closed">closed</span>';
  if (p.isDraft) return '<span class="pill draft">draft</span>';
  return '<span class="pill open">open</span>';
}
function checksPill(p) {
  const c = p.checks;
  if (!c) return '<span class="pill">no checks</span>';
  const cls = c.overall === 'passing' ? 'pass' : c.overall === 'failing' ? 'fail' : 'pending';
  const txt = c.overall === 'passing' ? `✓ ${c.pass}/${c.total} checks` : c.overall === 'failing' ? `✕ ${c.fail} failing` : `${c.pending} running`;
  return `<span class="pill ${cls}" title="${c.pass} passed · ${c.fail} failed · ${c.pending} running">${txt}</span>`;
}
function reviewPill(p) {
  if (p.reviewDecision === 'APPROVED') return '<span class="pill pass">approved</span>';
  if (p.reviewDecision === 'CHANGES_REQUESTED') return '<span class="pill fail">changes requested</span>';
  if (p.reviewDecision === 'REVIEW_REQUIRED') return '<span class="pill pending">needs review</span>';
  return '';
}

function prCell(b) {
  const p = b.pr;
  if (!p) return DATA.prError && !DATA.prAt ? '<span class="faint" title="GitHub could not be reached">unknown</span>' : '<span class="faint">no PR</span>';
  const link = `<a href="${esc(p.url)}" target="_blank" rel="noopener" title="${esc(p.title)}">#${p.number}</a>`;
  if (p.state === 'OPEN')
    return `<span class="prline">${link}${prStatePill(p)}</span><span class="prline">${checksPill(p)}${reviewPill(p)}</span>`;
  const earlier = !p.atTip ? '<span class="sub faint" title="This PR was for older commits; the branch has moved since">an earlier PR</span>' : '';
  return `<span class="prline">${link}${prStatePill(p)}</span>${earlier}`;
}

function runCell(b) {
  if (!b.worktree) return '<span class="faint">not checked out</span>';
  const ports = (b.ports && b.ports.length)
    ? `<span class="ports">${b.ports.map((p) =>
        `<a class="port ${p.kind.toLowerCase()}" href="http://localhost:${p.port}" target="_blank" rel="noopener" title="${esc(p.proc)} · pid ${p.pid} — open localhost:${p.port}">${p.kind} :${p.port}</a>`).join('')}</span>`
    : '<span class="sub faint" title="checked out here, but no dev server is listening">nothing running</span>';
  return `<span class="wtname" title="${esc(b.worktree)}">${esc(b.worktreeName)}</span>${ports}`;
}

function actionsCell(b) {
  const sug = b.status.action;
  const locked = !!b.lockedAt, isTarget = b.name === TARGET || (TARGET === STATE.main && b.isMain);
  const btn = (act, label, disabled, title, cls = '') =>
    `<button class="act ${cls}${sug === act ? ' sug' : ''}" data-act="${act}" ${disabled ? 'disabled' : ''} title="${esc(title)}">${label}</button>`;
  const inWt = 'checked out in another worktree (' + (b.worktreeName || '') + ') — do it there';

  let first;
  if (b.isMain) {
    first = btn('update-main', 'Update', !STATE.mainBehind, STATE.mainBehind ? `fast-forward local ${STATE.main} to origin/${STATE.main}` : `local ${STATE.main} is up to date with origin/${STATE.main}`);
  } else {
    const k = b.push.kind, can = k === 'local' || k === 'unpushed' || k === 'gone';
    first = btn('push', 'Push', !can, can ? `git push -u origin ${b.name}`
      : k === 'synced' ? 'nothing to push — already in sync'
      : k === 'behind' ? 'the remote branch is ahead — pull first' : 'local and remote differ — push from your terminal');
  }
  const pr = b.pr && (b.pr.state === 'OPEN' || sug === 'view-pr')
    ? `<a class="act${sug === 'view-pr' ? ' sug' : ''}" href="${esc(b.pr.url)}" target="_blank" rel="noopener" title="open PR #${b.pr.number} on GitHub">View PR</a>`
    : btn('pr', 'Open PR', b.isMain || !b.ahead, b.isMain ? `can't open a PR for ${STATE.main}`
      : !b.ahead ? `nothing to open a PR for — no commits that are not in ${TARGET}` : 'push the branch and open a pull request');
  const moveOff = locked ? inWt : isTarget ? 'this is the target' : '';
  return first + pr +
    btn('rebase', 'Rebase', !!moveOff, moveOff || `replay this branch on top of ${TARGET}`) +
    btn('reset', 'Reset', !!moveOff, moveOff || `make this branch identical to ${TARGET}`) +
    btn('delete', 'Delete', b.isMain || b.isCurrent || locked,
      b.isMain ? `can't delete ${STATE.main}` : b.isCurrent ? 'this branch is checked out — switch away first' : locked ? inWt : 'delete this branch', 'danger');
}

// ── expanded details ──
function detailsHtml(b) {
  const d = DETAIL[b.name];
  let commits;
  if (!d || d.loading) commits = '<div class="note"><span class="spin"></span> &nbsp;Loading commits…</div>';
  else if (!d.data.ok) commits = `<div class="note">Could not load commits: ${esc(d.data.error || 'unknown error')}</div>`;
  else if (!d.data.commits.length) commits = `<div class="note">No commits of its own — everything on this branch is already in ${esc(TARGET)}.</div>`;
  else commits = `<ul class="commits">${d.data.commits.map((c) =>
      `<li><span class="sha">${esc(c.sha)}</span><span>${esc(c.subject)} <span class="who">· ${esc(c.author)} · ${esc(c.rel)}</span></span></li>`).join('')}</ul>` +
      (d.data.more ? `<div class="note faint" style="margin-top:6px">Showing the newest ${d.data.commits.length}.</div>` : '');
  const st = d && d.data && d.data.ok && d.data.commits.length ? d.data.stat : null;
  const stat = st ? `<span>${plural(st.files, 'file')} · <span class="plus">+${num(st.insertions)}</span> <span class="minus">−${num(st.deletions)}</span></span>` : '';

  const remote = b.upstream
    ? `<span class="mono">${esc(b.upstream)}</span> ${b.push.kind === 'gone' ? '(deleted on GitHub)' : esc(b.track)}`
    : 'none — never pushed';
  const ports = !b.worktree ? '' : (b.ports && b.ports.length)
    ? b.ports.map((p) => `${p.kind} <a href="http://localhost:${p.port}" target="_blank" rel="noopener">localhost:${p.port}</a> <span class="faint">${esc(p.proc || '')} · pid ${p.pid}</span>`).join('<br>')
    : 'nothing running' + (b.expectedPorts ? ` <span class="faint">(usually FE :${b.expectedPorts.fe} · BE :${b.expectedPorts.be})</span>` : '');
  const branch = `<dl class="kv">
    <dt>Last commit</dt><dd><span class="mono faint">${esc(b.sha)}</span> ${esc(b.subject || '—')}</dd>
    <dt>Belongs to</dt><dd>${b.mine ? '<span class="ok">You</span>' : b.owner.by.length ? esc(b.owner.by.join(', ')) : '<span class="muted">Not known</span>'} <span class="faint">· ${esc(b.owner.why)}</span></dd>
    <dt>Last commit by</dt><dd>${esc(b.author || '?')}${b.authorEmail ? ` <span class="mono faint">&lt;${esc(b.authorEmail)}&gt;</span>` : ''}</dd>
    <dt>Updated</dt><dd>${esc(b.rel)}</dd>
    <dt>Remote branch</dt><dd>${remote}</dd>
    <dt>Worktree</dt><dd>${b.worktree ? `<span class="mono">${esc(b.worktree)}</span>` : 'not checked out anywhere'}</dd>
    ${b.worktree ? `<dt>Dev servers</dt><dd>${ports}</dd>` : ''}
  </dl>`;

  let pr;
  if (b.pr) {
    const p = b.pr;
    pr = `<dl class="kv">
      <dt>PR</dt><dd><a href="${esc(p.url)}" target="_blank" rel="noopener">#${p.number}</a> ${prStatePill(p)}${!p.atTip && p.state !== 'OPEN' ? ' <span class="faint">for older commits</span>' : ''}</dd>
      <dt>Title</dt><dd>${esc(p.title || '—')}</dd>
      <dt>Into</dt><dd class="mono">${esc(p.baseRefName || STATE.main)}</dd>
      ${p.state === 'OPEN' ? `<dt>Conflicts</dt><dd>${p.mergeable === 'CONFLICTING' ? '<span class="pill fail">has conflicts</span>' : p.mergeable === 'MERGEABLE' ? 'none' : 'not known yet'}</dd>` : ''}
      <dt>Checks</dt><dd>${checksPill(p)}</dd>
      <dt>Review</dt><dd>${reviewPill(p) || '<span class="faint">no review yet</span>'}</dd>
      <dt>Updated</dt><dd>${esc(fmtDate(p.updatedAt))}</dd>
    </dl>`;
  } else {
    pr = `<div class="note">No pull request for this branch.</div>`;
  }

  return `<div class="det"><h4>Commits not in ${esc(TARGET)}<span>${stat}</span></h4>${commits}</div>
    <div class="det"><h4>Branch</h4>${branch}</div>
    <div class="det"><h4>Pull request</h4>${pr}</div>`;
}

async function ensureDetail(b) {
  const key = b.fullSha + '|' + TARGET;
  if (DETAIL[b.name] && DETAIL[b.name].key === key) return;
  DETAIL[b.name] = { key, loading: true };
  const data = await api.detail(b.name, TARGET).catch(() => ({ ok: false, error: 'server not reachable' }));
  if (!DETAIL[b.name] || DETAIL[b.name].key !== key) return; // superseded by a newer request
  DETAIL[b.name] = { key, data };
  const row = [...document.querySelectorAll('.row')].find((r) => r.dataset.name === b.name);
  const det = row && row.querySelector('.details');
  if (det) det.innerHTML = detailsHtml(b);
}

// ── list ──
function rowHtml(b) {
  const open = OPEN.has(b.name);
  if (open) ensureDetail(b);
  const tags = [];
  if (b.isCurrent) tags.push('<span class="tag cur">current</span>');
  const by = b.owner.by;   // only people behind the branch's own commits, never the last commit's author
  if (!b.mine && by.length)
    tags.push(`<span class="tag notmine" title="the commits on this branch are by ${esc(by.join(', '))}, not you — be careful">by ${esc(by.slice(0, 2).join(', '))}${by.length > 2 ? ` +${by.length - 2}` : ''}</span>`);
  const s = b.status;
  return `<article class="row tone-${esc(s.tone)}${open ? ' open' : ''}" data-name="${esc(b.name)}">
    <div class="row-main" title="Click for details">
      <div class="cell c-branch">
        <div class="l1"><button class="exp" data-act="toggle" aria-expanded="${open}" aria-label="details for ${esc(b.name)}">▶</button>
          <span class="bname${b.isMain ? ' main' : ''}">${esc(b.name)}</span>${tags.join('')}</div>
        <div class="l2"><span class="verdict"><i></i>${esc(s.label)}</span><span class="hint">${esc(s.hint)}</span></div>
        <div class="l3" title="${esc(b.subject)}">${esc(b.subject)} · ${esc(b.rel)}</div>
      </div>
      <div class="cell c-vs" data-label="vs ${esc(TARGET)}">${vsCell(b)}</div>
      <div class="cell c-push" data-label="Pushed">${pushCell(b)}</div>
      <div class="cell c-pr" data-label="Pull request">${prCell(b)}</div>
      <div class="cell c-run" data-label="Running">${runCell(b)}</div>
      <div class="cell c-act">${actionsCell(b)}</div>
    </div>
    ${open ? `<div class="details">${detailsHtml(b)}</div>` : ''}
  </article>`;
}

function renderList() {
  const base = baseRows();
  if (!VIEWS.some((v) => v.key === VIEW)) VIEW = 'all';
  $('#views').innerHTML = VIEWS.map((v) => {
    const n = base.filter(v.test).length;
    return `<button class="view${v.key === VIEW ? ' on' : ''}${v.key === 'attn' && n ? ' attn' : ''}" data-view="${v.key}">${v.label}<span class="n">${n}</span></button>`;
  }).join('');

  const rows = base.filter(VIEWS.find((v) => v.key === VIEW).test);
  const list = $('#list');
  if (!rows.length) {
    const total = (DATA.branches || []).length;
    const filtered = MINE_ONLY || QUERY.trim() || VIEW !== 'all';
    list.innerHTML = `<div class="empty">${total && filtered ? 'No branches match these filters.<br><button class="btn" data-clear="1">Show all branches</button>' : 'No branches.'}</div>`;
    return;
  }
  list.innerHTML = GROUPS.map((g) => {
    const rs = rows.filter((b) => b.status.group === g.key);
    if (!rs.length) return '';
    const sub = typeof g.sub === 'function' ? g.sub() : g.sub;
    return `<section class="group"><h2>${g.title}<span class="n">${rs.length}</span>${sub ? `<small>${esc(sub)}</small>` : ''}</h2>
      <div class="rows">${rs.map(rowHtml).join('')}</div></section>`;
  }).join('');
}

function toggleRow(name) {
  if (OPEN.has(name)) OPEN.delete(name); else OPEN.add(name);
  store.set('open', [...OPEN]);
  renderList();
}

// ── modal ──
function closeModal() { $('#modalBg').classList.remove('show'); $('#modal').oninput = null; $('#modal').onchange = null; }
const modalOpen = () => $('#modalBg').classList.contains('show');
$('#modalBg').addEventListener('click', (e) => { if (e.target === $('#modalBg')) closeModal(); });

function confirmModal({ title, desc, command, warn, confirmLabel, danger, onConfirm }) {
  $('#modal').innerHTML = `
    <h3>${esc(title)}</h3>
    <div class="desc">${esc(desc || '')}</div>
    <div class="cmd">${esc(command)}</div>
    ${warn ? `<div class="mwarn">⚠ ${esc(warn)}</div>` : ''}
    <div class="foot">
      <button class="btn ghost" id="mCancel">Cancel</button>
      <button class="btn ${danger ? 'red' : 'accent'}" id="mOk">${esc(confirmLabel || 'Run')}</button>
    </div>`;
  $('#modalBg').classList.add('show');
  $('#mCancel').onclick = closeModal;
  $('#mOk').onclick = () => { closeModal(); onConfirm(); };
  (danger ? $('#mCancel') : $('#mOk')).focus();
}

function askReset(b) {

  confirmModal({
    title: `Reset “${b}” → ${TARGET}`,
    desc: onCur ? 'Hard-resets the checked-out branch.' : 'Force-moves the branch pointer.',
    command: resetCmd(b),
    danger: true,
    confirmLabel: 'Reset (hard)',
    warn: onCur
      ? (STATE.dirty ? 'You have uncommitted changes — a hard reset will DISCARD them.' : 'Commits on this branch ahead of the target will be discarded.')
      : 'Commits on this branch ahead of the target will be discarded.',
    onConfirm: () => act('reset', { branch: b, target: TARGET }, `Reset ${b} → ${TARGET}`),
  });
}

function askRebase(b) {
  confirmModal({
    title: `Rebase “${b}” onto ${TARGET}`,
    desc: 'Replays this branch’s commits on top of the target. Auto-aborts on conflict.',
    command: rebaseCmd(b),
    confirmLabel: 'Rebase',
    warn: (b === STATE.current && STATE.dirty) ? 'Uncommitted changes may block the rebase — commit or stash first.' : '',
    onConfirm: () => act('rebase', { branch: b, target: TARGET }, `Rebase ${b} onto ${TARGET}`),
  });
}

function askPush(b) {
  confirmModal({

    desc: 'Uploads this branch’s commits to origin. Never forced — if the remote has different commits, it fails and changes nothing.',
    command: `git push -u origin ${b}`,
    confirmLabel: 'Push',
    onConfirm: () => act('push', { branch: b }, `Push ${b}`),

}

function askUpdateMain() {

    command: STATE.current === m ? `git pull --ff-only origin ${m}` : `git fetch origin ${m}:${m}`,
    confirmLabel: `Update ${m}`,
    warn: STATE.mainAhead > 0 ? `Local ${m} has ${plural(STATE.mainAhead, 'commit')} of its own, so git will refuse the fast-forward and change nothing.` : '',

}

function askPR(b) {

    <div class="desc">Pushes the branch, then creates the PR. Leave fields blank to auto-fill from commits.</div>
    <div class="cmd">${esc(prCmd(b))}</div>

function askDelete(b, hasRemote) {
  const br = findBranch(b);
  const risky = br && br.status.group !== 'cleanup';
  $('#modal').innerHTML = `
    <h3>Delete branch “${esc(b)}”</h3>
    <div class="desc">Removes the local branch (recoverable via <code>git reflog</code> for a while).</div>
    <div class="cmd" id="delCmd">git branch -D ${esc(b)}</div>
    ${hasRemote ? `<label class="minef" style="margin-top:12px"><input type="checkbox" id="delRemote" /> Also delete remote <code>origin/${esc(b)}</code> (affects the shared GitHub repo)</label>` : ''}
    <div class="mwarn">⚠ ${risky && br.ahead ? `This branch has ${plural(br.ahead, 'commit')} that ${br.ahead === 1 ? 'is' : 'are'} not in ${esc(TARGET)}. ` : ''}Force-deletes even if the branch isn’t merged.</div>
    <div class="foot">
      <button class="btn ghost" id="mCancel">Cancel</button>
      <button class="btn red" id="mOk">Delete</button>

// ── worktrees ──
const wtList = () => DATA.worktrees || [];
const findWt = (p) => wtList().find((w) => w.path === p);
const uncommitted = (n) => plural(n, 'uncommitted file');
const slug = (s) => String(s).replace(/[^A-Za-z0-9._-]+/g, '-').replace(/^[-.]+/, '').replace(/-+$/, '');

// Why a new branch cannot be started in this worktree ('' means it can).
function newBranchBlock(w) {
  if (w.prunable) return 'the folder of this worktree is missing';
  if (w.isRepo && w.branch === STATE.main) return `this checkout stays on ${STATE.main}`;
  if (w.dirtyCount) return `${uncommitted(w.dirtyCount)} here — commit or stash first`;
  return '';
}

function wtRunning(w) {
  if (w.prunable) return '';
  if (!w.ports.length) return '<span class="faint">nothing running</span>';
  return `<span class="ports">${w.ports.map((p) =>
    `<a class="port ${p.kind.toLowerCase()}" href="http://localhost:${p.port}" target="_blank" rel="noopener" title="${esc(p.proc)} · pid ${p.pid}">${p.kind} :${p.port}</a>`).join('')}</span>`;
}

function wtRowHtml(w) {
  const where = w.prunable ? '<span class="warn">folder is missing</span>'
    : w.branch ? `on <b class="mono">${esc(w.branch)}</b>`
    : `<span class="muted">detached at <span class="mono">${esc(w.head)}</span></span>`;
  const state = w.prunable ? '' : w.dirtyCount
    ? `<span class="chip dirty">${uncommitted(w.dirtyCount)}</span>` : '<span class="chip clean">clean</span>';
  const tag = (w.isRepo ? '<span class="tag cur" title="the checkout this console runs on">main checkout</span>' : '') +
    (w.mine ? '<span class="tag yours" title="one of your worktrees: every branch open in it, or worked on in it, is yours">yours</span>' : '');
  const noBranch = newBranchBlock(w);
  const noRemove = w.isRepo ? 'this is the checkout the console runs on, it cannot be removed' : w.locked ? 'this worktree is locked (git worktree unlock)' : '';
  const btn = (act, label, off, title, cls = '') =>
    `<button class="wbtn ${cls}" data-wt="${act}" ${off ? 'disabled' : ''} title="${esc(off || title)}">${label}</button>`;
  return `<div class="wt" data-path="${esc(w.path)}">
    <div class="wt-id"><span class="wt-name" title="${esc(w.path)}">${esc(w.name)}</span><span class="wt-where">${where}${tag}</span></div>
    <span class="wt-state">${state}</span>
    <span>${wtRunning(w)}</span>
    <span class="wt-act">${btn('branch', 'New branch', noBranch, 'start a new branch in this worktree')}${btn('remove', w.prunable ? 'Clean up' : 'Remove', noRemove,
      w.prunable ? 'forget this worktree, its folder is already gone' : 'remove this worktree (its branch is kept)', 'danger')}</span>
  </div>`;
}

function renderWorktrees() {
  const open = store.get('wtOpen', true), list = wtList();
  $('#wts').className = 'group wts' + (open ? ' open' : '');
  $('#wts').innerHTML = `<h2><button class="exp" data-wt="toggle" aria-expanded="${open}" aria-label="show or hide worktrees">▶</button>Worktrees<span class="n">${list.length}</span>` +
    `<small>folders where branches are open</small></h2>` + (open ? `<div class="rows">${list.map(wtRowHtml).join('')}</div>` : '');
}

// ── worktree dialogs ──
const bases = () => (STATE.hasOriginMain ? ['origin/' + STATE.main, STATE.main] : [STATE.main]);
const baseOptions = () => bases().map((t) => `<option value="${esc(t)}"${t === TARGET ? ' selected' : ''}>${esc(t)}</option>`).join('');
const inModal = (sel) => $('#modal').querySelector(sel);
function openModal(html) {
  $('#modal').innerHTML = html;
  $('#modalBg').classList.add('show');
  $('#mCancel').onclick = closeModal;
}

function askNewWorktree() {
  if (!DATA.worktrees || !DATA.wtSetup) return;
  const setup = DATA.wtSetup, viaWt = setup.kind === 'wt';
  const names = new Set((DATA.branches || []).map((b) => b.name));
  const free = (DATA.branches || []).filter((b) => !b.worktree).map((b) => b.name).sort();
  const usedPaths = new Set(wtList().map((w) => w.path));
  const noNumber = viaWt && setup.nextNumber === null;

  openModal(`
    <h3>New worktree</h3>
    <div class="desc">A separate folder where a branch is open, so you can work on two things at once.</div>
    <div class="field"><label>Branch</label>
      <div class="choice">
        <label><input type="radio" name="wbMode" value="new" checked /> New branch</label>
        <label title="${free.length ? '' : 'every branch is already open in a worktree'}"><input type="radio" name="wbMode" value="old" ${free.length ? '' : 'disabled'} /> Existing branch</label>
      </div></div>
    <div class="field" id="wbNew"><div class="two">
      <div><label>Name of the new branch</label><input type="text" id="wbName" data-enter placeholder="feat-my-change" autocomplete="off" spellcheck="false" /></div>
      <div><label>Start from</label><select id="wbBase">${baseOptions()}</select></div>
    </div></div>
    <div class="field" id="wbOld" style="display:none"><label>Branch to open</label>
      <select id="wbExisting">${free.map((n) => `<option value="${esc(n)}">${esc(n)}</option>`).join('')}</select></div>
    <div class="field">${viaWt
      ? `<label>Worktree number (${setup.min} to ${setup.max})</label><input type="number" id="wbNum" data-enter min="${setup.min}" max="${setup.max}" step="1" value="${setup.nextNumber ?? ''}" />`
      : `<label>Folder name</label><div class="prefixed"><span>${esc(setup.repoName)}-</span><input type="text" id="wbFolder" data-enter autocomplete="off" spellcheck="false" /></div>`}
      <div class="hint" id="wbHint"></div></div>
    <div class="cmd" id="wbCmd"></div>
    ${viaWt ? '<div class="mwarn">⚠ Sets up env files, dependencies and a database for the new worktree. This can take a minute.</div>' : ''}
    <div class="foot">
      <button class="btn ghost" id="mCancel">Cancel</button>
      <button class="btn accent" id="mOk">Create worktree</button>
    </div>`);

  let folderTouched = false;
  const sync = () => {
    const mode = inModal('input[name=wbMode]:checked').value;
    inModal('#wbNew').style.display = mode === 'new' ? '' : 'none';
    inModal('#wbOld').style.display = mode === 'old' ? '' : 'none';
    const branch = mode === 'new' ? inModal('#wbName').value.trim() : (inModal('#wbExisting').value || '');
    const base = inModal('#wbBase').value;
    let problem = '';
    if (mode === 'new') {
      if (!branch) problem = 'Type a name for the new branch.';
      else if (/\s/.test(branch)) problem = 'A branch name cannot contain spaces.';
      else if (branch.startsWith('-')) problem = 'A branch name cannot start with a dash.';
      else if (names.has(branch)) problem = `A branch named “${branch}” already exists.`;
    } else if (!branch) problem = 'Every branch is already open in a worktree.';

    let wtPath = '', n = null, folder = '', where = '';
    if (viaWt) {
      n = parseInt(inModal('#wbNum').value, 10);
      if (noNumber) problem = problem || `All ${setup.max} worktree numbers are in use. Remove one first.`;
      else if (!(n >= setup.min && n <= setup.max)) problem = problem || `The number must be from ${setup.min} to ${setup.max}.`;
      else {
        wtPath = `${setup.parent}/${setup.repoName}-${3000 + n}`;
        where = `Folder ${setup.repoName}-${3000 + n} · frontend :${3000 + n} · backend :${4000 + n}`;
        if (usedPaths.has(wtPath)) problem = problem || `Number ${n} is already in use.`;
      }
    } else {
      const f = inModal('#wbFolder');
      if (!folderTouched) f.value = slug(branch);
      folder = f.value.trim();
      if (!/^[A-Za-z0-9_][A-Za-z0-9._-]*$/.test(folder)) problem = problem || 'The folder name can only use letters, numbers, dots, dashes and underscores.';
      else {
        wtPath = `${setup.parent}/${setup.repoName}-${folder}`;
        where = `Folder ${wtPath}`;
        if (usedPaths.has(wtPath)) problem = problem || 'That folder is already a worktree.';
      }
    }
    const hint = inModal('#wbHint');
    hint.textContent = problem || where;
    hint.className = 'hint' + (problem && (branch || mode === 'old') ? ' bad' : '');
    const b = branch || '<branch>';
    inModal('#wbCmd').textContent = viaWt
      ? (mode === 'new' ? `git branch --no-track ${b} ${base}\n` : '') + `scripts/wt create ${Number.isNaN(n) ? '<number>' : n} ${b}`
      : (mode === 'new' ? `git worktree add --no-track -b ${b} ${wtPath || '<folder>'} ${base}` : `git worktree add ${wtPath || '<folder>'} ${b}`);
    inModal('#mOk').disabled = !!problem;
    return { mode, branch, base, n, folder, name: viaWt ? `${setup.repoName}-${3000 + n}` : `${setup.repoName}-${folder}` };
  };
  $('#modal').oninput = (e) => { if (e.target.id === 'wbFolder') folderTouched = true; sync(); };
  $('#modal').onchange = sync;
  inModal('#mOk').onclick = () => {
    const s = sync();
    if (inModal('#mOk').disabled) return;
    closeModal();
    act('worktree-add', { branch: s.branch, newBranch: s.mode === 'new', base: s.base, ...(viaWt ? { number: s.n } : { folder: s.folder }) },
      `Create worktree ${s.name}`);
  };
  sync();
  inModal('#wbName').focus();
}

function askNewBranch(pre) {
  if (!DATA.worktrees) return;
  const wts = wtList();
  const eligible = wts.filter((w) => !newBranchBlock(w));
  if (!eligible.length) {
    openModal(`<h3>New branch</h3>
      <div class="desc">A new branch is started inside one of your worktrees. None of them can take one right now:</div>
      <div class="cmd">${esc(wts.map((w) => `${w.name}: ${newBranchBlock(w)}`).join('\n'))}</div>
      <div class="foot"><button class="btn ghost" id="mCancel">Close</button></div>`);
    return;
  }
  const names = new Set((DATA.branches || []).map((b) => b.name));
  const chosen = (pre && eligible.find((w) => w.path === pre)) || eligible[0];
  openModal(`
    <h3>New branch in a worktree</h3>
    <div class="desc">Creates the branch and switches that worktree onto it. The branch it is on now is kept.</div>
    <div class="field"><label>Worktree</label><select id="nbWt">${wts.map((w) => {
      const why = newBranchBlock(w);
      return `<option value="${esc(w.path)}" ${w.path === chosen.path ? 'selected' : ''} ${why ? 'disabled' : ''}>${esc(w.name)} · ${w.branch ? 'on ' + esc(w.branch) : 'detached'}${why ? ' (' + esc(why) + ')' : ''}</option>`;
    }).join('')}</select></div>
    <div class="field"><div class="two">
      <div><label>Name of the new branch</label><input type="text" id="nbName" data-enter placeholder="feat-my-change" autocomplete="off" spellcheck="false" /></div>
      <div><label>Start from</label><select id="nbBase">${baseOptions()}</select></div>
    </div><div class="hint" id="nbHint"></div></div>
    <div class="cmd" id="nbCmd"></div>
    <div class="foot">
      <button class="btn ghost" id="mCancel">Cancel</button>
      <button class="btn accent" id="mOk">Create branch</button>
    </div>`);
  const sync = () => {
    const name = inModal('#nbName').value.trim(), base = inModal('#nbBase').value, path = inModal('#nbWt').value;
    let problem = '';
    if (!name) problem = 'Type a name for the new branch.';
    else if (/\s/.test(name)) problem = 'A branch name cannot contain spaces.';
    else if (name.startsWith('-')) problem = 'A branch name cannot start with a dash.';
    else if (names.has(name)) problem = `A branch named “${name}” already exists.`;
    inModal('#nbHint').textContent = problem;
    inModal('#nbHint').className = 'hint' + (problem && name ? ' bad' : '');
    inModal('#nbCmd').textContent = `git -C ${path} switch -c ${name || '<branch>'} --no-track ${base}`;
    inModal('#mOk').disabled = !!problem;
    return { name, base, path };
  };
  $('#modal').oninput = sync;
  $('#modal').onchange = sync;
  inModal('#mOk').onclick = () => {
    const s = sync();
    if (inModal('#mOk').disabled) return;
    closeModal();
    act('branch-new', { worktree: s.path, name: s.name, base: s.base }, `New branch ${s.name} in ${(findWt(s.path) || {}).name || 'worktree'}`);
  };
  sync();
  inModal('#nbName').focus();
}

function askRemoveWorktree(path) {
  const w = findWt(path);
  if (!w) return;
  const viaWt = w.wtId !== null && w.wtId !== undefined && !w.prunable;
  const ports = w.ports.map((p) => `${p.kind} :${p.port}`).join(', ');
  openModal(`
    <h3>${w.prunable ? 'Clean up' : 'Remove'} worktree “${esc(w.name)}”</h3>
    <div class="desc">${w.prunable
      ? 'The folder is already gone. This only clears git’s record of it.'
      : `Deletes the folder <code>${esc(w.path)}</code>.` + (w.branch ? ` The branch <code>${esc(w.branch)}</code> is kept, so no commits are lost.` : '')}</div>
    <div class="cmd" id="rmCmd"></div>
    ${w.dirtyCount ? `<label class="minef" style="margin-top:12px"><input type="checkbox" id="rmForce" /> Throw away the ${uncommitted(w.dirtyCount)} in this worktree</label>` : ''}
    ${viaWt ? `<label class="minef" style="margin-top:12px"><input type="checkbox" id="rmDb" /> Also delete this worktree’s database</label>` : ''}
    ${ports ? `<div class="mwarn">⚠ ${viaWt ? `Stops the dev servers running here: ${esc(ports)}.` : `${esc(ports)} is still running from this folder. Stop it first.`}</div>` : ''}
    ${w.dirtyCount ? `<div class="mwarn">⚠ Uncommitted files are lost for good. Tick the box above to confirm.</div>` : ''}
    <div class="mwarn" id="rmDbWarn" style="display:none">⚠ The database and everything in it is deleted for good.</div>
    <div class="foot">
      <button class="btn ghost" id="mCancel">Cancel</button>
      <button class="btn red" id="mOk">${w.prunable ? 'Clean up' : 'Remove worktree'}</button>
    </div>`);
  const sync = () => {
    const force = !!(inModal('#rmForce') && inModal('#rmForce').checked), dropDb = !!(inModal('#rmDb') && inModal('#rmDb').checked);
    inModal('#rmCmd').textContent = w.prunable ? 'git worktree prune'
      : viaWt ? `scripts/wt ${dropDb ? 'delete' : 'remove'} ${w.wtId}` : `git worktree remove${force ? ' --force' : ''} ${w.path}`;
    inModal('#mOk').disabled = !!w.dirtyCount && !force;
    inModal('#rmDbWarn').style.display = dropDb ? '' : 'none';
    return { force, dropDb };
  };
  $('#modal').onchange = sync;
  inModal('#mOk').onclick = () => {
    const s = sync();
    if (inModal('#mOk').disabled) return;
    closeModal();
    act('worktree-remove', { path: w.path, force: s.force, dropDb: s.dropDb }, `${w.prunable ? 'Clean up' : 'Remove'} worktree ${w.name}`);
  };
  sync();
  $('#mCancel').focus();
}

// ── run an action ──
let outTimer = null;
async function act(endpoint, body, label) {
  if (BUSY) return;
  BUSY = true; document.body.classList.add('busy');
  showOut(label, '<span class="spin"></span> running…');
  const r = await api.post(endpoint, body).catch(() => ({ ok: false, error: 'server not reachable — is it still running?' }));
  const clean = (t) => (t || '').replace(/\x1b\[[0-9;]*[A-Za-z]/g, '').trim(); // drop terminal colour / cursor codes
  const lines = [];
  if (r.cmd) lines.push('$ ' + r.cmd);
  if (clean(r.stdout)) lines.push(clean(r.stdout));
  if (clean(r.stderr)) lines.push(clean(r.stderr));
  if (r.url) lines.push((r.existing ? 'PR already open: ' : 'PR created: ') + r.url);
  if (r.error) lines.push('✖ ' + r.error);
  const head = r.ok
    ? `<span class="okc">✓ ${esc(label)}</span>` + (r.url ? ` — <a href="${esc(r.url)}" target="_blank" rel="noopener">${esc(r.url)}</a>` : '')
    : `<span class="errc">✖ ${esc(label)} failed</span>`;
  showOut(label, head + '\n\n' + esc(lines.join('\n\n')));
  BUSY = false; document.body.classList.remove('busy');
  if (r.ok && !r.url) outTimer = setTimeout(hideOut, 6000); // success closes itself; failures and PR links stay
  await load({ force: true });
}

function showOut(title, html) {
  clearTimeout(outTimer);
  $('#outTitle').textContent = title;
  $('#outPre').innerHTML = html;
  $('#out').classList.add('show');
}
function hideOut() { clearTimeout(outTimer); $('#out').classList.remove('show'); }
$('#outClose').onclick = hideOut;
$('#out').addEventListener('mouseenter', () => clearTimeout(outTimer)); // reading it → keep it open

// ── controls ──
function setTarget(t) {
  TARGET = t; store.set('target', t); LAST_SIG = '';
  load();
}
$('#seg').addEventListener('click', (e) => {
  const btn = e.target.closest('button'); if (!btn) return;
  setTarget(btn.dataset.t);
});
$('#views').addEventListener('click', (e) => {
  const btn = e.target.closest('button'); if (!btn) return;
  VIEW = btn.dataset.view; store.set('view', VIEW); renderList();
});
$('#mineOnly').addEventListener('change', (e) => { MINE_ONLY = e.target.checked; store.set('mine', MINE_ONLY); renderList(); });
$('#q').addEventListener('input', (e) => { QUERY = e.target.value; renderList(); });
$('#refreshBtn').onclick = () => load({ force: true });
$('#fetchBtn').onclick = () => act('fetch', {}, 'git fetch --prune origin');
$('#newWtBtn').onclick = () => askNewWorktree();
$('#newBranchBtn').onclick = () => askNewBranch();
$('#wts').addEventListener('click', (e) => {
  const el = e.target.closest('[data-wt]'); if (!el || el.disabled) return;
  if (el.dataset.wt === 'toggle') { store.set('wtOpen', !store.get('wtOpen', true)); return renderWorktrees(); }
  const row = el.closest('.wt'); if (!row) return;
  if (el.dataset.wt === 'branch') askNewBranch(row.dataset.path);
  if (el.dataset.wt === 'remove') askRemoveWorktree(row.dataset.path);
});

$('#banners').addEventListener('click', (e) => {
  const btn = e.target.closest('[data-banner]'); if (!btn) return;
  if (btn.dataset.banner === 'retry') load({ force: true });
  if (btn.dataset.banner === 'use-origin') setTarget('origin/' + STATE.main);
  if (btn.dataset.banner === 'update-main') askUpdateMain();
});

$('#list').addEventListener('click', (e) => {
  if (e.target.closest('[data-clear]')) {
    VIEW = 'all'; MINE_ONLY = false; QUERY = ''; $('#q').value = '';
    store.set('view', VIEW); store.set('mine', false); renderHeader(); renderList();
    return;
  }
  const row = e.target.closest('.row'); if (!row) return;
  const name = row.dataset.name;
  const actEl = e.target.closest('[data-act]');
  if (actEl) {
    if (actEl.disabled) return;
    const b = findBranch(name);
    switch (actEl.dataset.act) {
      case 'toggle': return toggleRow(name);
      case 'push': return askPush(name);
      case 'pr': return askPR(name);
      case 'rebase': return askRebase(name);
      case 'reset': return askReset(name);
      case 'delete': return askDelete(name, !!(b && b.upstream && b.push.kind !== 'gone'));
      case 'update-main': return askUpdateMain();
    }
    return;
  }
  if (e.target.closest('a, button, .details')) return;        // links, disabled buttons, the details panel itself
  if (String(window.getSelection())) return;                   // selecting text is not a click
  if (e.target.closest('.row-main')) toggleRow(name);
});

document.addEventListener('keydown', (e) => {
  if (e.key === 'Enter' && modalOpen() && e.target.matches && e.target.matches('[data-enter]')) {
    const ok = $('#mOk');
    if (ok && !ok.disabled) { e.preventDefault(); ok.click(); }
    return;
  }
  if (e.key === 'Escape') {
    if (modalOpen()) return closeModal();
    if (document.activeElement === $('#q')) { QUERY = ''; $('#q').value = ''; $('#q').blur(); renderList(); }
    return;
  }
  const typing = /^(INPUT|TEXTAREA)$/.test((document.activeElement || {}).tagName || '');
  if (typing || modalOpen() || e.ctrlKey || e.metaKey || e.altKey) return;
  if (e.key === '/') { e.preventDefault(); $('#q').focus(); }
  if (e.key === 'r') load({ force: true });
});

// keep it fresh while the tab is visible, without disturbing a dialog or a running command
setInterval(() => {
  renderFresh();
  if (document.visibilityState === 'visible' && !modalOpen() && !BUSY && Date.now() - LOADED_AT >= AUTO_REFRESH_MS) load();
}, 5000);
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'visible' && !modalOpen() && !BUSY && Date.now() - LOADED_AT > 10000) load();
});

load();
</script>
</body>
</html>
